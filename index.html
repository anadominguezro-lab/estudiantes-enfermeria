<script>
// Registro del service worker con ruta relativa (la app vive en un subdirectorio de GitHub Pages).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      function ofrecerActualizacion(worker) {
        var toast = document.getElementById('toast-update');
        var btn = document.getElementById('btn-update');
        if (!toast || !btn) return;
        toast.hidden = false;
        btn.onclick = function () {
          btn.disabled = true;
          worker.postMessage({ type: 'SKIP_WAITING' });
        };
      }
      if (reg.waiting && navigator.serviceWorker.controller) ofrecerActualizacion(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var nuevo = reg.installing;
        if (!nuevo) return;
        nuevo.addEventListener('statechange', function () {
          if (nuevo.state === 'installed' && navigator.serviceWorker.controller) ofrecerActualizacion(nuevo);
        });
      });
    }).catch(function (e) { console.warn('SW no registrado:', e); });

    var recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (recargando) return;
      recargando = true;
      window.location.reload();
    });
  });
}
</script>
